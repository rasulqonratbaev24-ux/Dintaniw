<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>GAME</title>

<style>
body{background:#111;color:white;font-family:Arial;text-align:center;}

.score{display:flex;justify-content:center;gap:10px;margin:10px;}

.team{padding:20px;border:8px solid white;border-radius:10px;}

input{width:120px;text-align:center;font-size:40px;}

table{margin:auto;border-collapse:collapse;}

td,th{
width:240px;height:120px;
border:8px solid white;
cursor:pointer;
}

th{background:red;}
td{background:blue;font-size:48px;}

.modal{
position:fixed;
top:50%;left:50%;
transform:translate(-50%,-50%);
background:#222;
padding:60px;
font-size:40px;
border:10px solid white;
width:65%;
z-index:999;
max-height:70vh;
overflow:auto;
}

.option{
margin:40px;
padding:30px;
font-size:30px;
background:#333;
cursor:pointer;
}

.option:hover{background:#555;}

#bonusBox{
display:none;
position:fixed;
top:50%;left:50%;
transform:translate(-50%,-50%);
background:gold;
color:black;
padding:80px;
font-size:64px;
border:10px solid white;
z-index:9999;
}
</style>
</head>

<body>

<h1>🎮 JEOPARDY PRO FINAL</h1>

<div class="score">
<div class="team">T1 <input></div>
<div class="team">T2 <input></div>
<div class="team">T3 <input></div>
<div class="team">T4 <input></div>
</div>

<div id="turnBox">🎯 : T1</div>

<table id="board"></table>
<div id="bonusBox"></div>

<script>

const pts=[100,200,300,400,500,600,700,800];
const cats=["Islam","Buddizm","Xristianliq","Mix1","Mix2"];

let currentTeam = 1;

/* QUESTIONS */
const questions = {
"Islam": [
{q: "622-jılı Mekke musılmanları, sonıń ishinde, Muxammed (s.a.v.) qay jerge hijrat etti?", o: {A: "Madinaga", B: "Habashstanga", C: "Hiratqa", D: "Qudusqa"}, a: "A"},
{q: "Payǵambarımız (s.a.v.) Mekkeni basıp alıwdan keyin Kaabanı tawaf qılganda neshe márte aylangan?", o: {A: "5", B: "9", C: "7", D: "3"}, a: "C"},
{q: "Qaysı túnde Payǵambarımız (s.a.w.) Mekke qalasınan Quddusqa alıp barılıp, aspanlarga kóterilgen hádiyse júz bergen?", o: {A: "Qádir túni", B: "Mıraj túni", C: "Hijrat túni", D: "Badr túni"}, a: "B"},
{q: "Musılmanlar hám Mekke mushrikleri ortasındaǵı ekinshi sawash qaysi?", o: {A: "Badr", B: "Uhud", C: "Xandaq", D: "Azhob"}, a: "B"},
{q: "Neshenshi jilda dáslepki musılmanlar Habashstanga hijrat etti?", o: {A: "614", B: "613", C: "611", D: "615"}, a: "D"},
{q: "........ arabsha ádet, dástúr, is-háreket túri degen mánilerdi bildiredi.", o: {A: "Sunna", B: "Aqida", C: "Fiqh", D: "Qiyos"}, a: "A"},
{q: "……. (arabsha - rawan sóylew, gáp, sóz) -islam teologiyalıq ilimi?", o: {A: "Hadis", B: "Qiroat", C: "Kalom", D: "Tafsir"}, a: "C"},
{q: "Islam tariyxında birinshi xalifa hám Payǵambar orınbasarı kim?", o: {A: "Abu Bakr Siddiq", B: "Omar ibn Xattob", C: "Ali ibn Abi Talib.", D: "Usman ibn Affon"}, a: "A"}
],
"Buddizm": [
{q: "Buddizm dininde Siddxartxa Gautama kim dep ataladı hám onıń sózlik mánisi Nurshashqan (yamasa Oyanǵan) degendi bildiredi?", o: {A: "Dxarma", B: "Budda", C: "Maxatma", D: " Guru"}, a: "B"},
{q: "Buddizm payda bolǵan, onıń dáslepki tálimatları aytılǵan hám búgingi kúnde de usı din eń muqaddas dep esaplaǵan tariyxıy úlke (mámleket) qaysı?", o: {A: "Qıtay", B: "Yaponiya", C: "Hindistan", D: "Misir"}, a: "C"},
{q: "Pali tilinen awdarmalanǵanda Úsh sebet mánisin beretuǵın, buddizmniń eń tiykarǵı muqaddas tekstleri toplamı qalay ataladı?", o: {A: "Avesto", B: "Tripitaka", C: "Upanishadlar", D: "Vedalar"}, a: "B"},
{q: "Insannıń barlıq isleri, niyetleri hám háreketleri onıń keyingi ómirindegi táǵdirin belgilewshi sebep hám aqıbet nızamı ne dep ataladı?", o: {A: "Nirvana", B: "Sangxa", C: "Karma ", D: "Samsara"}, a: "C"},
{q: "Buddizmniń Kishi arba yaki Aqsaqallardıń táliymatı dep atalatuǵın, monastir turmısın hám jeke zahidlikti birinshi orınǵa qoyatuǵın eń áyyemgi dástúriy baǵdarı qaysı?", o: {A: "Maxayana", B: "Teravada", C: "Zen", D: "Tantra"}, a: "B"},
{q: "Buddizm táliymatındaǵı Tórt joqarı haqıyqatqa kóre, barlıq insanıylıq azap-aqıbetleriniń dáslepki hám tiykarǵı sebebi ne dep kórsetiledi?", o: {A: " Nápis, tilekler hám baylanıp qalıw", B: "Kambaǵallıq hám ashlıq", C: " Kesellik hám qarrılıq", D: "rıslar hám ádalatsızlıq"}, a: "A"},
{q: "Budda tálimatındaǵı azaptan qutılıw hám Nirvanag'a erisiw jolı bolǵan Asilzoda segiz basqıshlı jol qaysı úsh tiykarg'ı toparǵa bólinedi?", o: {A: "Sawap, Gúna, Táwbe", B: "Danalıq, Axlaq , Toplanıw", C: " Ishtiyaq, Bilim, Namaz", D: "Tınıshlıq, Ádalat, Kúsh"}, a: "B"},
{q: "Buddizm filosofiyasında barlıq mawjudatların' turaqlı o'zgeriste ekenligi, hesh nárse ma'n'gi emesligi ha'm o'zgermas Men (Ruh) joq ekenligin an'latıwshı fundamental tu'sinik qalay ataladı?", o: {A: "Anatman", B: "Boddxisatva", C: " Mandala", D: "Sangsar"}, a: "A"}
],
"Xristianliq": [
{q: "Ózbekstanda xristianlıqtıń qaysı baģdarı en keń tarqalgan?", o: {A: "katolik", B: "pravoslav", C: "protestant", D: "baptist"}, a: "B"},
{q: "Qaysi dinde bir Qudayǵa iseniledi, biraq Quday kórinisinde túsindiriledi?", o: {A: "Islam", B: "Yahudiylik", C: "Xristianlıq", D: "Buddizm"}, a:"C"},
{q: "Xristianlıq ideologiyasınıń tiykarģı tálimatları qaysı kitap bóliminde, yaǵnıy Isa Masihtıń ómiri hám tálimatları bayan etilgen bólimde berilgen?", o: {A: "Eski Ahd", B: "Jana Ahd", C: "Quran", D: "Talmud"}, a: "B"},
{q: "Xristianlıq tariyxında qaysı húkimdar xristianlıqtı Rim imperiyasının rásmiy mámleketlik dini dep járiyalagan?", o: {A: "Konstantin", B: "Theodosius I", C: "Yulian Apostat", D: "Neron"}, a: "B"},
{q: "Katoliklikte Bibliyanı talqılaw huqıqı tek kimlerge beriledi?", o: {A: "Ápiwayı adamlarǵa", B: "Ruwxaniylerge", C: "Episkoplarga", D: "shirkew ierarxiyalarina"}, a: "D"},
{q: "Qashannan baslap rim-katolik hám grek-pravoslav shirkewleri ģárezsiz jumis alıp barmaqta?", o: {A: "XI ásir ortalarınan", B: "IX ásir ortalarınan", C: "XII ásir ortalarınan", D: "X ásir ortalarınan"}, a: "A"},
{q: "Qaysi shirkew barlıq ruwxaniylerge úyleniwdi qadaǵan etedi?", o: {A: "katolik", B: "lyuteran", C: "pravoslav", D: "anglikan"}, a:"A"},
{q: "Pravoslavlarda tek kimler shanaraq qurmaydi?", o: {A: "episkoplar", B: "ruwxanıylar", C: "monarxlar", D: "abbatlar"}, a:"C"}
],
"Mix1": [
{q: "SUWRET", o: {A: "25", B: "27", C: "30", D: "32"}, a: "B"},
{q: "Garri Potter filminde Garri qaysı mektepte oqıydı?", o: {A: "Hogwarts", B: "Durmstrang", C: "Beauxbatons", D: "Ilvermorny"}, a: "A"},
{q: "Qaysi planeta Quyash sistemasında eń ıssı planeta esaplanadı?", o: {A: "Merkuriy", B: "Venera", C: "Mars", D: "Yupiter"}, a: "B"},
{q: "FIFA qaǵıydalarına bola, dárwazaman erkin soqqı waqtında toptı qolında neshe sekundqa shekem uslap turiwi múmkin?", o: {A: "4", B: "8", C: "10", D: "6"}, a: "D"},
{q: "SUWRET", o: {A: "1", B: "4", C: "2", D: "3"}, a: "C"},
{q: "Titanik filminde Rose hám Jek birinshi márte qay jerde ushırasadı?", o: {A: " Kemede restoranında", B: " Palubada", C: "Liftte", D: "Qutqariw qayıǵında"}, a: "B"},
{q: "UFC tariyxında bir túnde hám Fight of the Night hám Performance of the Night bonusların alǵan birinshi jawınger kim?", o: {A: "Conor McGregor", B: "Nate Diaz", C: "Donald Cerrone", D: "Anderson Silva"}, a: "C"},
{q: "Dúnyadaǵı qaysı mámlekettiń rásmiy paytaxtı joq?", o: {A: "Shveytsariya", B: " Lyuksemburg", C: " Vatikan", D: "Malta"}, a: "A"}
],
"Mix2": [
{q: "Qaysi mámleket aymaǵı bir waqıttıń ózinde Evropa hám Aziyada jaylasqan?", o: {A: "Turkiya", B: "Rossiya", C: "Qazaqstan", D: "Barlıq juwaplar durıs"}, a: "A"},
{q: "Korol Artur Pendragondı kim óltiredi?", o: {A: "Morgana", B: "Aithusa", C: "Mordred", D: "Agravaine de Bois"}, a: "C"},
{q: "SUWRET", o: {A: "5", B: "7", C: "4", D: "9"}, a: "A"},
{q: "Insan miyi bir kúnde shama menen neshe pikir payda etedi?", o: {A: "17000", B: "19000", C: "70000", D: "7000"}, a: "C"},
{q: "2007/2008-máwsimde Altın top (Ballon d'or) kimge berilgen?", o: {A: "C.Ronaldo", B: "Kaka", C: "L.Messi", D: "Ronaldinho"}, a: "B"},
{q: "UFC tariyxında double champion bolǵan birinshi jawınger:", o: {A: "Khabib Nurmagomedov", B: "Conor McGregor", C: "Daniel Cormier", D: "Stipe Miocic"}, a: "B"},
{q: "Marvel - Thanos rolin qaysı aktyor oynaǵan?", o: {A: "Tom Hiddleston", B: "Josh Brolin", C: "Chris Evans", D: "Mark Ruffalo"}, a: "B"},
{q: "SUWRET", o: {A: "602", B: "402", C: "046", D: "042"}, a: "D"}
]
};

/* BONUS */
let bonus=[];
while(bonus.length<4){
let r=Math.floor(Math.random()*40);
if(!bonus.includes(r)) bonus.push(r);
}

function board(){
let t=document.getElementById("board");
let h="<tr>";
cats.forEach(c=>h+="<th>"+c+"</th>");
h+="</tr>";
t.innerHTML=h;

for(let i=0;i<8;i++){
let r="<tr>";
for(let j=0;j<5;j++){
let id=i*5+j;
r+=`<td onclick="openQ(${j},${i},this,${id})">${pts[i]}</td>`;
}
r+="</tr>";
t.innerHTML+=r;
}
}

function showBonus(txt){
let b=document.getElementById("bonusBox");
b.innerText=txt;
b.style.display="block";
setTimeout(()=>b.style.display="none",1500);
}

function openQ(c,i,cell,id){

if(bonus.includes(id)){
let arr=["⚡ 2X","🔁 SWAP","🚨 STEAL","💰 +1000"];
showBonus(arr[Math.floor(Math.random()*4)]);
cell.style.background="gold";
cell.innerText="🎁";
return;
}

let qq = questions[cats[c]][i];

let div=document.createElement("div");
div.className="modal";
div.innerHTML="<h3>"+qq.q+"</h3>";

Object.entries(qq.o).forEach(([k,v])=>{
let b=document.createElement("div");
b.className="option";
b.innerText=k+": "+v;

b.onclick=()=>{
alert(k===qq.a?"✔ Correct":"❌ Error");
cell.style.background="gray";
cell.onclick=null;
div.remove();

currentTeam++;
if(currentTeam>4) currentTeam=1;

document.getElementById("turnBox").innerText =
"🎯 : T"+currentTeam;
};

div.appendChild(b);
});

document.body.appendChild(div);
}

board();

</script>

</body>
</html>
